<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Architecture of Us - 3D Book</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Playfair+Display:ital@1&display=swap');

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #050505; /* Deep dark aesthetic background */
            background-image: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000 100%);
            font-family: 'Cinzel', serif;
            perspective: 1500px; /* Crucial for 3D depth */
            overflow: hidden;
        }

        /* The 3D Book Wrapper */
        .book-wrapper {
            position: relative;
            width: 320px;
            height: 480px;
            transform-style: preserve-3d;
            /* Tilted angle to show spine, front, and top pages */
            transform: rotateX(25deg) rotateY(-30deg) rotateZ(0deg); 
            transition: transform 1s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: grab;
        }

        /* Interactive tilt on hover */
        .book-wrapper:hover {
            transform: rotateX(15deg) rotateY(-20deg) scale(1.05);
        }

        /* All sides of the book */
        .book-face {
            position: absolute;
            top: 0;
            left: 0;
            box-sizing: border-box;
            border-radius: 3px;
        }

        /* 1. FRONT COVER */
        .front {
            width: 320px;
            height: 480px;
            background: #111; /* Dark matte finish */
            transform: translateZ(25px); /* Half of book thickness */
            box-shadow: inset 4px 0 10px rgba(0,0,0,0.8), inset -1px 0 2px rgba(255,255,255,0.1);
            border-radius: 2px 6px 6px 2px;
            padding: 20px;
        }

        /* 2. BACK COVER */
        .back {
            width: 320px;
            height: 480px;
            background: #0f0f0f;
            transform: translateZ(-25px) rotateY(180deg);
            border-radius: 6px 2px 2px 6px;
            box-shadow: 10px 20px 40px rgba(0,0,0,0.9); /* Drop shadow on desk */
        }

        /* 3. SPINE (Left side) */
        .spine {
            width: 50px; /* Book thickness */
            height: 480px;
            background: linear-gradient(to right, #0a0a0a, #1a1a1a, #0a0a0a);
            left: -25px;
            transform: rotateY(-90deg);
            border-radius: 2px 0 0 2px;
        }

        /* 4. PAGES (Right side) */
        .pages-right {
            width: 48px;
            height: 468px; /* Slightly shorter than cover */
            background: #e0dacc; /* Vintage paper color */
            background-image: repeating-linear-gradient(to right, transparent, transparent 2px, #c2bba8 2px, #c2bba8 3px); /* Page lines */
            right: -24px;
            left: auto;
            top: 6px;
            transform: rotateY(90deg);
        }

        /* 5. PAGES (Top side) */
        .pages-top {
            width: 312px;
            height: 48px;
            background: #e0dacc;
            background-image: repeating-linear-gradient(to bottom, transparent, transparent 2px, #c2bba8 2px, #c2bba8 3px);
            top: -24px;
            left: 6px;
            transform: rotateX(90deg);
        }

        /* 6. PAGES (Bottom side) */
        .pages-bottom {
            width: 312px;
            height: 48px;
            background: #d1cbc0;
            bottom: -24px;
            top: auto;
            left: 6px;
            transform: rotateX(-90deg);
            box-shadow: 5px 15px 30px rgba(0,0,0,0.8);
        }


        /* ========================================= */
        /* COVER DESIGN (Same as your Image)         */
        /* ========================================= */

        .golden-border {
            position: absolute;
            top: 20px;
            bottom: 20px;
            left: 30px; /* Spine hinge gap */
            right: 20px;
            border: 2px solid #d4af37;
            outline: 1px solid #d4af37;
            outline-offset: -8px;
            pointer-events: none;
        }

        .golden-border::before, .golden-border::after {
            content: '';
            position: absolute;
            width: 25px;
            height: 25px;
            border: 2px solid #d4af37;
        }

        .golden-border::before {
            top: -8px; left: -8px;
            border-right: none; border-bottom: none;
        }
        
        .golden-border::after {
            bottom: -8px; right: -8px;
            border-left: none; border-top: none;
        }

        .content {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding-left: 10px;
        }

        .title {
            color: #d4af37;
            font-size: 34px;
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px #614d18, 
                         4px 4px 6px rgba(0,0,0,0.9);
            margin-bottom: 25px;
            z-index: 2;
        }

        .divider {
            width: 50px;
            height: 2px;
            background: #d4af37;
            margin-bottom: 100px;
            box-shadow: 0px 2px 4px rgba(0,0,0,0.5);
        }

        .author {
            position: absolute;
            bottom: 50px;
            color: #d4af37;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 22px;
            letter-spacing: 1.5px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        /* Spine details */
        .spine-text {
            color: #d4af37;
            font-size: 14px;
            letter-spacing: 3px;
            white-space: nowrap;
            transform: rotate(90deg);
            transform-origin: left;
            position: absolute;
            top: 50px;
            left: 20px;
            font-family: 'Cinzel', serif;
        }

    </style>
</head>
<body>

    <div class="book-wrapper">
        <!-- Back Cover -->
        <div class="book-face back"></div>
        
        <!-- Thick Pages -->
        <div class="book-face pages-right"></div>
        <div class="book-face pages-top"></div>
        <div class="book-face pages-bottom"></div>
        
        <!-- Spine Binding -->
        <div class="book-face spine">
            <div class="spine-text">THE ARCHITECTURE OF US</div>
        </div>
        
        <!-- Front Cover -->
        <div class="book-face front">
            <div class="golden-border"></div>
            <div class="content">
                <div class="title">THE<br>ARCHITECTURE<br>OF US</div>
                <div class="divider"></div>
                <div class="author">Ahrnav Sharma</div>
            </div>
        </div>
    </div>

</body>
</html>
